[env:charlie-eyes]
; pioarduino = PlatformIO with Arduino-ESP32 3.3.x (Waveshare validated on 3.3.x).
; Pinned on purpose: "stable" moved to Arduino 4.0 / GCC 15 and breaks the GFX library.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16MB QIO flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200

; Arduino_GFX comes from lib/GFX_Library_for_Arduino: Waveshare's own copy for this
; board (v1.6.4 + their 3.3.8+ SPI fix), minus the unused 17MB of CJK fonts.

; Touch (CST9217) + motion sensor (QMI8658): same SensorLib version Waveshare ships (0.3.1)
; ArduinoJson for parsing Base44 responses
lib_deps =
    https://github.com/lewisxhe/SensorLib.git#v0.3.1
    bblanchon/ArduinoJson@^7.0.0
