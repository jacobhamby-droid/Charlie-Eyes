[env:charlie-eyes]
; pioarduino = PlatformIO with Arduino-ESP32 3.x (Waveshare's examples are
; validated on 3.x; the stock platform "espressif32 @ 6.x" is Arduino 2.0.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16MB QIO flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200

; Same Arduino_GFX version Waveshare ships with this board (1.6.4)
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.4
